# main 推 → 部署 21 点主站；arcade 推 → 主站 + /arcade/ 游戏厅一起部署
# 上线地址：https://civinar-riley.github.io/blackjack-21/ 与 https://civinar-riley.github.io/blackjack-21/arcade/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, arcade]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Checkout arcade
        uses: actions/checkout@v4
        with:
          ref: arcade
          path: arcade
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Build 主站 (main)
        run: cd main && npm ci && npm run build
      - name: Build 游戏厅 (arcade)
        run: cd arcade && npm ci && npm run build
      - name: Assemble
        run: |
          mkdir -p _site/arcade
          cp -r main/dist/* _site/
          cp -r arcade/dist/* _site/arcade/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
