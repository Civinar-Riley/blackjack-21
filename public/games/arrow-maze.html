<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>箭头迷宫</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #1b2740 0%, #0c1220 60%, #080d18 100%);
    color:#eef2fa;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;user-select:none;
  }
  #app{width:100%;max-width:460px;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px;}
  header{display:flex;align-items:center;justify-content:space-between;}
  .title{font-size:20px;font-weight:800;letter-spacing:2px;}
  .title small{display:block;font-size:11px;color:#8b96ad;font-weight:400;letter-spacing:0;margin-top:2px;}
  .meta{display:flex;align-items:center;gap:10px;}
  #remain{font-size:13px;color:#aeb8cc;white-space:nowrap;}
  #remain b{color:#ffd166;font-size:16px;}
  #newgame{background:linear-gradient(180deg,#e8c85a,#c39a2b);border:none;color:#231a05;
    font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;cursor:pointer;}
  #newgame:active{transform:scale(.96);}
  #board{position:relative;display:flex;justify-content:center;}
  svg{width:100%;height:auto;display:block;background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;touch-action:manipulation;}
  .ap{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;transition:opacity .25s;}
  .ap-hit{fill:none;stroke:rgba(0,0,0,0);stroke-width:44;cursor:pointer;pointer-events:stroke;}
  .blocked{opacity:.22;cursor:not-allowed;}
  .blocked + .ap-hit{cursor:not-allowed;}
  .clearing{opacity:0 !important;transition:opacity .3s;}
  .glow{filter:drop-shadow(0 0 7px #ffd166);opacity:1 !important;}
  .shake{animation:shk .3s;transform-box:fill-box;transform-origin:center;}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  #toast{position:fixed;left:50%;bottom:18%;transform:translateX(-50%) translateY(10px);
    background:rgba(10,14,24,.92);border:1px solid rgba(212,175,55,.5);color:#ffe9a8;
    font-size:14px;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;
    transition:opacity .25s, transform .25s;z-index:50;white-space:nowrap;max-width:92vw;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #win{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(5,8,15,.72);z-index:40;backdrop-filter:blur(3px);}
  #win.hidden{display:none;}
  .win-card{background:linear-gradient(180deg,#182238,#0e1526);border:1px solid rgba(212,175,55,.55);
    border-radius:18px;padding:34px 44px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .win-card .big{font-size:44px;margin-bottom:8px;}
  .win-card h2{margin:0 0 6px;font-size:22px;letter-spacing:3px;color:#ffd166;}
  .win-card p{margin:0 0 18px;color:#9aa5bc;font-size:13px;}
  .win-card button{background:linear-gradient(180deg,#e8c85a,#c39a2b);border:none;color:#231a05;
    font-weight:800;font-size:15px;padding:11px 30px;border-radius:12px;cursor:pointer;letter-spacing:2px;}
  .hint{font-size:12px;color:#69738a;text-align:center;line-height:1.7;}
  .hint b{color:#c8d0e2;font-weight:600;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">➡️ 箭头迷宫<small>箭头正前方被挡住就点不了，先清掉它前面的</small></div>
    <div class="meta"><span id="remain">剩余 <b>--</b> 条</span><button id="newgame">换一局</button></div>
  </header>
  <div id="board"><svg id="svg" viewBox="0 0 400 560" aria-label="箭头迷宫棋盘"></svg></div>
  <div class="hint">🎯 每条箭头是独立车道、互不重叠<br/>🌈 <b>彩虹箭头</b>：点掉后额外随机带走 5 条　💪 <b>粗箭头</b>：3 倍粗，正前方 3 条全清才能点</div>
</div>
<div id="toast"></div>
<div id="win" class="hidden">
  <div class="win-card">
    <div class="big">🏆</div>
    <h2>全部清除</h2>
    <p>迷宫清空，干得漂亮！</p>
    <button id="again">再来一局</button>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
 * 箭头迷宫消除 v2 —— 贴合原图规则：箭头互不重叠，每条是独立车道。
 * 阻挡规则：某条箭头「箭头正前方」的格子被谁占着，谁就挡住它；
 *   普通箭头 1 个头 → 最多 1 个阻挡；粗箭头 3 格宽 → 3 个头 → 3 个阻挡。
 * 纯逻辑部分不依赖 DOM，可被 node 直接 eval 做生成器冒烟测试。
 * 存档：localStorage 鍵 arrowmaze_v2 = {seed, cleared:[pathId]}（壳垫片自动落盘）
 * ===================================================================== */

function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const COLS = 9, ROWS = 13;
const SAVE_KEY = 'arrowmaze_v2';
const DIRS4 = [[1,0],[0,1],[-1,0],[0,-1]];

/* 路径经过某格的方向（单位向量），用于画小箭头 */
function dirThrough(cells, i){
  let dx, dy;
  if (i < cells.length - 1){ dx = cells[i+1][0] - cells[i][0]; dy = cells[i+1][1] - cells[i][1]; }
  else { dx = cells[i][0] - cells[i-1][0]; dy = cells[i][1] - cells[i-1][1]; }
  return [Math.sign(dx), Math.sign(dy)];
}

/* 生成一局：{ paths, blockers }，失败返回 null（外层换种子重试）。
 * paths: [{id, cells(占格), spine(绘制中线), headCells, headDir, wide, rainbow}] */
function tryGen(rng){
  const occ = new Map(); // "x,y" -> pathId，严格互不重叠
  const paths = [];
  const key = (x, y) => x + ',' + y;
  const inB = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
  const occAt = (x, y) => occ.get(key(x, y));

  function commit(cells, o){
    const id = paths.length;
    const p = { id, cells, spine: o.spine || cells,
                headCells: o.headCells, headDir: o.headDir,
                wide: !!o.wide, rainbow: false };
    for (const [x, y] of cells) occ.set(key(x, y), id);
    paths.push(p);
    return p;
  }

  /* 从 (sx,sy) 出发的随机游走；返回 {cells, headCells, headDir} 或 null */
  function walkFrom(sx, sy, minLen, maxLen){
    if (!inB(sx, sy) || occAt(sx, sy) !== undefined) return null;
    const cells = [[sx, sy]];
    const seen = new Set([key(sx, sy)]);
    let di = (rng() * 4) | 0;
    const target = minLen + ((rng() * (maxLen - minLen + 1)) | 0);
    let guard = 0;
    while (cells.length < target && guard++ < 300){
      const rev = (di + 2) % 4;
      const cur = cells[cells.length - 1];
      const cands = [];
      for (let k = 0; k < 4; k++){
        if (k === rev) continue;
        const nx = cur[0] + DIRS4[k][0], ny = cur[1] + DIRS4[k][1];
        if (!inB(nx, ny) || seen.has(key(nx, ny)) || occAt(nx, ny) !== undefined) continue;
        cands.push([k, k === di ? 5 : 2.2]); // 惯性直走，弯弯绕绕
      }
      if (!cands.length) break;
      let tot = 0;
      for (const c of cands) tot += c[1];
      let r = rng() * tot, pick = cands[0][0];
      for (const c of cands){ r -= c[1]; if (r <= 0){ pick = c[0]; break; } }
      di = pick;
      const nx = cur[0] + DIRS4[di][0], ny = cur[1] + DIRS4[di][1];
      cells.push([nx, ny]);
      seen.add(key(nx, ny));
    }
    if (cells.length < minLen || cells.length < 2) return null;
    const n = cells.length;
    return { cells,
             headCells: [cells[n - 1]],
             headDir: [cells[n-1][0] - cells[n-2][0], cells[n-1][1] - cells[n-2][1]] };
  }
  function walk(minLen, maxLen){
    for (let t = 0; t < 100; t++){
      const w = walkFrom((rng() * COLS) | 0, (rng() * ROWS) | 0, minLen, maxLen);
      if (w) return w;
    }
    return null;
  }

  /* 1) 粗箭头：直的，3 格宽，长度 4~7；头朝随机方向 */
  let big = null;
  for (let t = 0; t < 150 && !big; t++){
    const di = (rng() * 4) | 0;
    const [dx, dy] = DIRS4[di];
    const [px, py] = [-dy, dx];
    const L = 4 + ((rng() * 4) | 0);
    const hx = (rng() * COLS) | 0, hy = (rng() * ROWS) | 0;
    const headCells = [[hx, hy], [hx + px, hy + py], [hx + px * 2, hy + py * 2]];
    let ok = true;
    for (const [cx, cy] of headCells){
      if (!inB(cx, cy) || !inB(cx + dx, cy + dy)){ ok = false; break; } // 头前方要能放挡它的
    }
    if (!ok) continue;
    const cells = [];
    for (let k = 0; k < L && ok; k++)
      for (const [cx, cy] of headCells){
        const x = cx - dx * k, y = cy - dy * k;
        if (!inB(x, y) || occAt(x, y) !== undefined){ ok = false; break; }
        cells.push([x, y]);
      }
    if (!ok) continue;
    const [mx, my] = headCells[1];
    const spine = [];
    for (let k = 0; k < L; k++) spine.push([mx - dx * k, my - dy * k]);
    big = commit(cells, { wide: true, spine, headCells, headDir: [dx, dy] });
  }
  if (!big) return null;

  /* 2) 3 条短箭头，正好挡在粗箭头 3 个头的前方 */
  const stubs = [];
  const [bdx, bdy] = big.headDir;
  for (const [hx, hy] of big.headCells){
    const w = walkFrom(hx + bdx, hy + bdy, 2, 4);
    if (!w) return null;
    stubs.push(commit(w.cells, { headCells: w.headCells, headDir: w.headDir }));
  }

  /* 3) 普通箭头：长短不一 */
  let placed = 0;
  for (let t = 0; t < 500 && placed < 10; t++){
    const w = walk(3, 12);
    if (!w) continue;
    commit(w.cells, { headCells: w.headCells, headDir: w.headDir });
    placed++;
  }
  if (placed < 8) return null;

  /* 4) 彩虹：从普通箭头里抽一条（不含粗箭头和 3 条挡它的） */
  const stubIds = new Set(stubs.map(s => s.id));
  const pool = paths.filter(p => !p.wide && !stubIds.has(p.id));
  if (!pool.length) return null;
  pool[(rng() * pool.length) | 0].rainbow = true;

  /* 5) 阻挡：头的正前方格子被谁占着，谁挡住它 */
  const blockers = new Map();
  const addB = (u, v) => {
    if (u === v) return;
    if (!blockers.has(u)) blockers.set(u, new Set());
    blockers.get(u).add(v);
  };
  for (const p of paths)
    for (const [hx, hy] of p.headCells){
      const q = occAt(hx + p.headDir[0], hy + p.headDir[1]);
      if (q !== undefined) addB(p.id, q);
    }
  if ((blockers.get(big.id) || new Set()).size !== 3) return null; // 粗箭头必须恰好 3 个阻挡

  /* 6) 无环检查（有环则整局重来，保证必可解） */
  const state = new Map();
  const dfs = (u) => {
    state.set(u, 1);
    for (const v of (blockers.get(u) || [])){
      const s = state.get(v) || 0;
      if (s === 1) return true;
      if (s === 0 && dfs(v)) return true;
    }
    state.set(u, 2);
    return false;
  };
  for (const p of paths)
    if ((state.get(p.id) || 0) === 0 && dfs(p.id)) return null;

  let maxOcc = 0;
  const seenCells = new Set();
  for (const [k] of occ){ if (seenCells.has(k)) maxOcc = 2; seenCells.add(k); }
  return { paths, blockers, maxOcc: seenCells.size === occ.size ? 1 : 2 };
}

function genLevel(seed){
  for (let a = 0; a < 80; a++){
    const lvl = tryGen(mulberry32(((seed + a * 0x9e3779b9) >>> 0)));
    if (lvl){ lvl.seed = (seed + a * 0x9e3779b9) >>> 0; return lvl; }
  }
  return tryGen(mulberry32(seed >>> 0));
}

/* 该箭头是否可点：正前方挡住它的都清掉了 */
function isClearable(level, id, cleared){
  const bs = level.blockers.get(id);
  if (!bs) return true;
  for (const b of bs) if (!cleared.has(b)) return false;
  return true;
}

/* ---------------- UI（只在浏览器里跑） ---------------- */
if (typeof document !== 'undefined' && typeof window !== 'undefined'){
(function(){
  const SVGNS = 'http://www.w3.org/2000/svg';
  const S = 40, PAD = 20;
  const svg = document.getElementById('svg');
  const remainEl = document.getElementById('remain');
  const toastEl = document.getElementById('toast');
  const winEl = document.getElementById('win');
  const X = i => PAD + i * S + S / 2, Y = j => PAD + j * S + S / 2;

  let level = null;
  let cleared = new Set();
  let seed = 0;

  function paintDefs(){
    svg.innerHTML = '';
    const defs = document.createElementNS(SVGNS, 'defs');
    const pat = document.createElementNS(SVGNS, 'pattern');
    pat.setAttribute('id', 'dots'); pat.setAttribute('width', S); pat.setAttribute('height', S);
    pat.setAttribute('patternUnits', 'userSpaceOnUse');
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', PAD + S/2); c.setAttribute('cy', PAD + S/2); c.setAttribute('r', 1.6);
    c.setAttribute('fill', 'rgba(255,255,255,.09)');
    pat.appendChild(c); defs.appendChild(pat);
    const g = document.createElementNS(SVGNS, 'linearGradient');
    g.setAttribute('id', 'rbow'); g.setAttribute('x1', '0'); g.setAttribute('y1', '0');
    g.setAttribute('x2', '1'); g.setAttribute('y2', '1');
    [['0','#ff5b5b'],['0.2','#ff9f43'],['0.4','#ffd93b'],['0.6','#4fc94f'],['0.8','#4f9fff'],['1','#b44fff']]
      .forEach(([o, col]) => {
        const st = document.createElementNS(SVGNS, 'stop');
        st.setAttribute('offset', o); st.setAttribute('stop-color', col);
        g.appendChild(st);
      });
    defs.appendChild(g);
    svg.appendChild(defs);
    const bg = document.createElementNS(SVGNS, 'rect');
    bg.setAttribute('x', 0); bg.setAttribute('y', 0);
    bg.setAttribute('width', 400); bg.setAttribute('height', 560);
    bg.setAttribute('fill', 'url(#dots)');
    svg.appendChild(bg);
  }

  function pathD(cells){
    return cells.map(([x, y], i) => (i ? 'L' : 'M') + X(x) + ' ' + Y(y)).join(' ');
  }
  function strokeOf(p){
    if (p.rainbow) return 'url(#rbow)';
    if (p.wide) return '#ffcf5c';
    return '#e6ebf5';
  }
  function widthOf(p){ return p.wide ? S * 1.5 : S * 0.5; }
  function headPos(p){
    const hc = p.wide ? p.headCells[1] : p.headCells[0];
    return [X(hc[0]), Y(hc[1])];
  }

  function render(){
    paintDefs();
    for (const p of level.paths){
      if (cleared.has(p.id)) continue;
      const g = document.createElementNS(SVGNS, 'g');
      g.setAttribute('data-id', p.id);
      g.setAttribute('class', 'pgroup');

      const vis = document.createElementNS(SVGNS, 'path');
      vis.setAttribute('d', pathD(p.spine));
      vis.setAttribute('class', 'ap' + (isClearable(level, p.id, cleared) ? '' : ' blocked'));
      vis.setAttribute('stroke', strokeOf(p));
      vis.setAttribute('stroke-width', widthOf(p));
      g.appendChild(vis);

      // 沿线小方向标
      for (let i = 2; i < p.spine.length; i += 3){
        const [dx, dy] = dirThrough(p.spine, i);
        const cx = X(p.spine[i][0]), cy = Y(p.spine[i][1]);
        const ang = Math.atan2(dy, dx) * 180 / Math.PI;
        const tri = document.createElementNS(SVGNS, 'path');
        const L = 13, Wd = 8.5;
        tri.setAttribute('d', `M ${L*0.7} 0 L ${-L*0.5} ${Wd} L ${-L*0.2} 0 L ${-L*0.5} ${-Wd} Z`);
        tri.setAttribute('fill', p.rainbow ? '#ffffff' : (p.wide ? '#5a430a' : '#0c1220'));
        tri.setAttribute('opacity', '.9');
        tri.setAttribute('transform', `translate(${cx} ${cy}) rotate(${ang})`);
        tri.setAttribute('pointer-events', 'none');
        g.appendChild(tri);
      }

      // 大箭头头：画在头中央
      {
        const [cx, cy] = headPos(p);
        const [dx, dy] = p.headDir;
        const ang = Math.atan2(dy, dx) * 180 / Math.PI;
        const sc = p.wide ? 2.1 : 1.5;
        const L = 15 * sc, Wd = 10.5 * sc;
        const tri = document.createElementNS(SVGNS, 'path');
        tri.setAttribute('d', `M ${L*0.75} 0 L ${-L*0.55} ${Wd} L ${-L*0.2} 0 L ${-L*0.55} ${-Wd} Z`);
        tri.setAttribute('fill', p.rainbow ? '#ffffff' : (p.wide ? '#5a430a' : '#e6ebf5'));
        tri.setAttribute('stroke', p.wide ? '#ffcf5c' : 'none');
        tri.setAttribute('stroke-width', 1.5);
        tri.setAttribute('transform', `translate(${cx} ${cy}) rotate(${ang})`);
        tri.setAttribute('pointer-events', 'none');
        g.appendChild(tri);
      }

      // 被挡住：锁徽章 + 阻挡数
      const bs = level.blockers.get(p.id);
      let nBlock = 0;
      if (bs) for (const b of bs) if (!cleared.has(b)) nBlock++;
      if (nBlock > 0){
        const mid = p.spine[(p.spine.length / 2) | 0];
        const badge = document.createElementNS(SVGNS, 'g');
        badge.setAttribute('pointer-events', 'none');
        const rc = document.createElementNS(SVGNS, 'circle');
        rc.setAttribute('cx', X(mid[0])); rc.setAttribute('cy', Y(mid[1]));
        rc.setAttribute('r', 13); rc.setAttribute('fill', 'rgba(8,12,22,.88)');
        rc.setAttribute('stroke', '#d4af37'); rc.setAttribute('stroke-width', 1.5);
        const tx = document.createElementNS(SVGNS, 'text');
        tx.setAttribute('x', X(mid[0])); tx.setAttribute('y', Y(mid[1]) + 5);
        tx.setAttribute('text-anchor', 'middle'); tx.setAttribute('font-size', '13');
        tx.setAttribute('fill', '#ffd166'); tx.textContent = '🔒' + nBlock;
        badge.appendChild(rc); badge.appendChild(tx);
        g.appendChild(badge);
      }

      const hit = document.createElementNS(SVGNS, 'path');
      hit.setAttribute('d', pathD(p.spine));
      hit.setAttribute('class', 'ap-hit');
      hit.addEventListener('pointerdown', ev => { ev.preventDefault(); onTap(p.id); });
      g.appendChild(hit);

      svg.appendChild(g);
    }
    updateRemain();
  }

  function updateRemain(){
    const n = level.paths.length - cleared.size;
    remainEl.innerHTML = '剩余 <b>' + n + '</b> 条';
  }

  let toastTimer = 0;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
  }

  function gOf(id){ return svg.querySelector(`g.pgroup[data-id="${id}"]`); }

  function onTap(id){
    if (cleared.has(id)) return;
    const p = level.paths[id];
    if (!isClearable(level, id, cleared)){
      const g = gOf(id);
      if (g){ g.classList.remove('shake'); void g.getBoundingClientRect(); g.classList.add('shake'); }
      const bs = level.blockers.get(id) || new Set();
      let names = 0;
      for (const b of bs){
        if (cleared.has(b)) continue;
        names++;
        const gb = gOf(b);
        if (gb){ gb.classList.add('glow'); setTimeout(() => gb.classList.remove('glow'), 900); }
      }
      toast(`它正前方被 ${names} 条箭头挡住了，先清掉发光的那${names > 1 ? '些' : '条'}`);
      return;
    }
    clearPath(id, false);
  }

  function clearPath(id, silent){
    if (cleared.has(id)) return;
    cleared.add(id);
    const p = level.paths[id];
    const g = gOf(id);
    if (g){
      g.classList.add('clearing');
      setTimeout(() => { if (g.parentNode) g.parentNode.removeChild(g); }, 320);
    }
    save();
    updateRemain();
    setTimeout(() => { if (!silent) render(); }, 300);
    if (p.rainbow && !silent){
      toast('🌈 彩虹爆发！随机带走 5 条');
      setTimeout(() => rainbowBlast(), 450);
    }
    setTimeout(checkWin, silent ? 60 : 700);
  }

  function rainbowBlast(){
    const rest = level.paths.filter(q => !cleared.has(q.id));
    for (let i = rest.length - 1; i > 0; i--){
      const j = (Math.random() * (i + 1)) | 0;
      const t = rest[i]; rest[i] = rest[j]; rest[j] = t;
    }
    rest.slice(0, 5).forEach((q, k) => setTimeout(() => clearPath(q.id, true), k * 160));
    setTimeout(() => { render(); checkWin(); }, 5 * 160 + 400);
  }

  function checkWin(){
    if (cleared.size >= level.paths.length){
      try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
      winEl.classList.remove('hidden');
    }
  }

  function save(){
    try{
      localStorage.setItem(SAVE_KEY, JSON.stringify({ v:2, seed, cleared:[...cleared] }));
    }catch(e){}
  }

  function load(){
    try{
      const o = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      if (o && o.v === 2 && typeof o.seed === 'number' && Array.isArray(o.cleared)) return o;
    }catch(e){}
    return null;
  }

  function newGame(newSeed){
    seed = (newSeed === undefined ? ((Date.now() ^ (Math.random() * 1e9)) >>> 0) : newSeed >>> 0);
    level = genLevel(seed);
    cleared = new Set();
    winEl.classList.add('hidden');
    save();
    render();
  }

  document.getElementById('newgame').addEventListener('click', () => newGame());
  document.getElementById('again').addEventListener('click', () => newGame());

  const s = load();
  if (s){
    seed = s.seed >>> 0;
    level = genLevel(seed);
    cleared = new Set(s.cleared.filter(id => Number.isInteger(id) && id >= 0 && id < level.paths.length));
  } else {
    seed = ((Date.now() ^ (Math.random() * 1e9)) >>> 0);
    level = genLevel(seed);
    cleared = new Set();
    save();
  }
  render();
  if (cleared.size >= level.paths.length) checkWin();
})();
}
</script>
</body>
</html>
